name: regenerate-lockfile-once

on:
  push:
    branches: [fix-lockfile-2026-09]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile from manifests
        run: |
          rm -f package-lock.json
          rm -rf node_modules
          npm install --ignore-scripts
          npm audit --omit=dev --audit-level=high
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already matches manifests."
          else
            git commit -m "chore: regenerate package lockfile"
            git push origin HEAD:fix-lockfile-2026-09
          fi
