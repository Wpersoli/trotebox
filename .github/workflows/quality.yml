name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: trotebox_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trotebox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trotebox_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/trotebox_test?schema=public
      PUBLIC_WEB_URL: http://localhost:3000
      PUBLIC_API_URL: http://localhost:3001
      ALLOWED_ORIGINS: http://localhost:3000
      TELEPHONY_PROVIDER: mock
      ENABLE_DEV_AUTH: true
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api/v1
      NEXT_PUBLIC_ENABLE_DEV_LOGIN: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Prepare ephemeral CI secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in JWT_SECRET DATA_ENCRYPTION_KEY HASH_PEPPER AUTH_CODE_PEPPER CRON_SECRET; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Generate recovery inventory
        run: npm run inventory
      - name: Verify recovery inventory
        run: npm run inventory:verify
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run quality:full
